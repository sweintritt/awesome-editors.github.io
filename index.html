<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="List of awesome code editors. From very simple to full blown IDE." />
    <meta name="keywords" content="code, editor, text, awesome, list, go, java, javascript, typescript, python, rust, c, c++, cpp" />
    <meta name="author" content="Stephan Weintritt" />
    <title>Awesome Code Editors</title>
    <link rel="icon" type="image/x-icon" href="icon_16.png" />
    <style>
      :root,
      :root.light {
        --color-bg: #ddd;
        --color-fg: #222;
        --color-header: seagreen;
        --color-table-header-bg: #ccc;
        --color-table-header-fg: cadetblue;
        --color-search-bg: #ddd;
        --color-search-fg: darkcyan;
        --color-search-border: #666;
        --color-table-hover: #ccc;
         --color-link: indianred;
      }

      :root.dark {
        --color-bg: #222;
        --color-fg: #ddd;
        --color-header: lightgreen;
        --color-table-header-bg: #444;
        --color-table-header-fg: lightblue;
        --color-search-bg: #222;
        --color-search-fg: lightblue;
        --color-search-border: #666;
        --color-table-hover: #333;
        --color-link: indianred;
      }

      body {
        color: var(--color-fg);
        background-color: var(--color-bg);
        font-family: monospace;
        font-size: 1.15em;
      }

      table {
        border-collapse: collapse;
        grid-template-columns: auto auto auto;
        border: .2em solid #555;
        padding: 1.5em;
        margin: 1em;
      }

      #header {
        padding: 1em;
        margin: 1em;
        border: .2em solid #555;
        text-align: left;
        color: var(--color-table-header-fg);
        background-color: var(--color-table-header-bg);
        font-weight: bold;
      }

      a {
        color: var(--color-link);
        text-decoration: none;
      }

      th,
      td {
        text-align: left;
        padding: 1.15em;
      }

      th {
        color: var(--color-table-header-fg);
        background-color: var(--color-table-header-bg);
        font-weight: bold;
      }

      #lightswitch {
        padding: 1em;
        float: right;
        font-weight: normal;
        text-align: center;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }

      #lightswitch:hover {
        background-color: var(--color-table-hover);
      }

      tr:hover {
        background-color: var(--color-table-hover);
      }

      #title {
        color: var(--color-header);
        font-size: 1.2em;
        font-weight: bolder;
      }

      @media only screen and (max-width: 1325px) {
          .optional1 {
              display: none;
          }
      }

      @media only screen and (max-width: 885px) {
          .optional2 {
              display: none;
          }
      }

      #search {
        width: 45%;
        padding: 5px;
        background-color: var(--color-search-bg);
        color: var(--color-search-fg);
        font-weight: bold;
        border: 2px solid var(--color-search-border);
      }

     #footer {
        left: 0;
        bottom: 0;
        width: 100%;
     }

     #icon {
        float: left;
        height: 5em;
        margin-right: 1em;
        margin-top: 1em;
     }
    </style>
  </head>
  <body onload="onLoad();">
      <div id="header">
          <span id="lightswitch" onclick="toggleLight()">light [X]</span>
          <img id="icon" src="icon_64.png">
          <p id="title">Awesome Code Editors</p>
          <p>List of awesome code editors. From very simple to full blown IDE.</p>
          <br>
          <input type="text" id="search" onkeyup="filter()" placeholder="Search..." />
      </div>
    </table>

    <div id="data">
      editors
    </div>
    <div id="footer">
      <a target="_blank" href="https://www.flaticon.com/free-icons/code">Code icon</a>
      created by
      <a target="_blank" href="https://www.flaticon.com/authors/smashicons">Smashicons</a>
    </div>
  </body>

  <script src="./editors.js"></script>
  <script>
    let mode = "light";

    function onLoad() {
      toggleLight();
      createTable();
    }

    function createTable() {
      const optionalColumns1 = new Set(["modes", "ai", "lsp", "plugins", "first release"])
      const optionalColumns2 = new Set(["written in", "gui or terminal", "latest release", "license"])
      const table = document.createElement("table");
      const tableHead = document.createElement("thead");
      const tableBody = document.createElement("tbody");

      // Append the table head and body to table
      table.appendChild(tableHead);
      table.appendChild(tableBody);

      // Creating table head
      let row = tableHead.insertRow();
      Object.keys(data[0]).forEach((key) => {
        if (key != "link") {
          let th = document.createElement("th");
          th.textContent = key.toUpperCase();
          if (optionalColumns1.has(key)) {
            th.classList.add("optional1");
          } else if (optionalColumns2.has(key)) {
            th.classList.add("optional2");
          }
          row.appendChild(th);
        }
      });

      // Creating table body
      data.forEach((item) => {
        let row = tableBody.insertRow();
        Object.keys(item).forEach((key) => {
          if (key !== 'link') {
            let cell = row.insertCell();
            let value = item[key];
            if (key === "name") {
              let a = document.createElement("a");
              a.href = item["link"];
              a.target = "_blank";
              a.title = "Link to project"
              a.appendChild(document.createTextNode(value));
              cell.appendChild(a);
            } else if (key === "repository") {
              let a = document.createElement("a");
              a.href = value;
              a.target = "_blank";
              a.title = "Link to repository"
              a.appendChild(document.createTextNode("repo"));
              cell.appendChild(a);
            } else {
              cell.textContent = value;
              if (optionalColumns1.has(key)) {
                cell.classList.add("optional1");
              } else if (optionalColumns2.has(key)) {
                cell.classList.add("optional2");
              }
            }
          }
          });
      });

      document.getElementById("data").replaceChildren();
      document.getElementById("data").appendChild(table);
    }

    function filter() {
      let input = document.getElementById("search");
      let filter = input.value.toLowerCase();
      let table = document.getElementById("data");
      let tr = table.getElementsByTagName("tr");

      for (let i = 0; i < tr.length; i++) {
        let tds = tr[i].getElementsByTagName("td");
        if (tds.length > 0) {
          let value = getLineText(tds);
          if (value.includes(filter)) {
            tr[i].style.display = "";
          } else {
            tr[i].style.display = "none";
          }
        }
      }
    }

    function getLineText(tds) {
      let result = "";
      for (let i = 0; i < tds.length; i++) {
        result += tds[i].textContent || td[i].innerText;
      }
      return result.toLowerCase();
    }

    function toggleLight() {
      let button = document.getElementById("lightswitch");

      if (mode === "light") {
        document.documentElement.classList.remove("light");
        document.documentElement.classList.add("dark");
        mode = "dark";
        button.innerText = "light [ ]";
      } else if (mode === "dark") {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        mode = "light";
        button.innerText = "light [x]";
      }
    }
  </script>
</html>
